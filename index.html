<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAK//CORE - ETAPA 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- HUD Principal -->
        <div id="stats-panel">
            <div class="stat-box">HP CORE: <span id="ui-hp">1M</span></div>
            <div class="stat-box">ENERGIA: <span id="ui-energy">0</span></div>
            <div class="stat-box">COMBO: x<span id="ui-combo-mult">1</span> (<span id="ui-combo">0</span>)</div>
            <div class="stat-box">DANO/CLQ: <span id="ui-damage">1</span></div>
            <div class="stat-box">CLIQUES: <span id="ui-clicks">0</span></div>
            <div class="stat-box meta-color">FRAGMENTOS: <span id="ui-fragments">0</span></div>
        </div>

        <div id="hp-bar-container">
            <div id="hp-bar-fill"></div>
        </div>

        <!-- Área de Interação -->
        <div id="core-container">
            <button id="core-button"></button>
        </div>
        
        <button id="extract-button" class="danger-btn">EXTRAIR FRAGMENTOS (FIM DE RUN)</button>

        <!-- OVERLAYS E MODAIS -->

        <!-- Seleção de Upgrades (Run) -->
        <div id="upgrade-modal" class="modal hidden">
            <h2>MARCO ALCANÇADO</h2>
            <p>Selecione um aprimoramento estrutural:</p>
            <div id="upgrade-cards-container" class="cards-container">
                <!-- Cartas geradas via JS -->
            </div>
        </div>

        <!-- Fim de Run / Resumo -->
        <div id="game-over-modal" class="modal hidden">
            <h2>RUN FINALIZADA</h2>
            <div id="run-summary" class="summary-box">
                <p>Cliques: <span id="sum-clicks">0</span></p>
                <p>Dano Causado: <span id="sum-damage">0</span></p>
                <p>Maior Combo: <span id="sum-combo">0</span></p>
                <p>Upgrades Obtidos: <span id="sum-upgrades">0</span></p>
                <h3 class="meta-color">Fragmentos Extraídos: +<span id="sum-fragments">0</span></h3>
            </div>
            <button id="to-meta-button" class="action-btn">ACESSAR NÚCLEO (META)</button>
        </div>

        <!-- Meta Progressão -->
        <div id="meta-modal" class="modal hidden">
            <h2 class="meta-color">SISTEMA PERMANENTE</h2>
            <p>Fragmentos Disponíveis: <span id="meta-fragments-display" class="meta-color bold">0</span></p>
            <div id="meta-upgrades-container" class="meta-container">
                <!-- Meta upgrades gerados via JS -->
            </div>
            <button id="restart-button" class="action-btn">INICIAR NOVA RUN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
