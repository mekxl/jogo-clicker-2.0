<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAK//CORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">BREAK//CORE</div>
        <div class="stats-container">
            <div class="stat-box">
                <span class="label">TARGET HP</span>
                <span id="ui-hp" class="value">0/0</span>
            </div>
            <div class="stat-box">
                <span class="label">ENERGY</span>
                <span id="ui-energy" class="value text-energy">0</span>
            </div>
            <div class="stat-box">
                <span class="label">COMBO</span>
                <span class="value"><span id="ui-combo" class="text-combo">0</span> <span class="multiplier">(x<span id="ui-multiplier">1</span>)</span></span>
            </div>
            <div class="stat-box">
                <span class="label">DMG/CLICK</span>
                <span id="ui-dmg" class="value">1</span>
            </div>
            <div class="stat-box">
                <span class="label">TOTAL CLICKS</span>
                <span id="ui-clicks" class="value text-muted">0</span>
            </div>
        </div>
    </header>

    <main class="center-stage">
        <div id="core-container">
            <div id="the-core"></div>
        </div>
    </main>

    <!-- Overlay para telas de fim de jogo -->
    <div id="game-over-screen" class="overlay hidden">
        <h1>TARGET DEFEATED</h1>
        <p>A energia do núcleo foi dissipada.</p>
        <button id="btn-restart">INICIAR NOVA RUN</button>
    </div>

    <!-- Ponto de entrada modular -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
